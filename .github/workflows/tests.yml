name: Tests
# Keep-alive: touched 2026-07-13 to reset GitHub's scheduled-workflow inactivity timer
on:
  push:
  pull_request:
  schedule:
    # Every Monday at 9:17 UTC — keeps Supabase active (free tier auto-pauses after 7 days idle)
    - cron: '17 9 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - name: Run Vitest
        id: tests
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile.junit=test-results/results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
